name: Apply donation update
on:
  workflow_dispatch:
  push:
    paths:
      - data/site.json

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Substitute donation values
        run: node scripts/update-site.mjs
      - name: Commit if changed
        run: |
          git config user.name "site-updater"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add index.html charity.html
          git commit -m "Update donation total from data/site.json"
          git push
